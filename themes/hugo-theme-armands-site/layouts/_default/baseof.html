<!DOCTYPE html>
<html lang="{{ .Site.Language.LanguageCode }}">
<head>
  {{ partial "head.html" . }}
</head>
<body id="single-page" class="page-landing">
  {{ partial "nav.html" . }}
  <div class="sp-landing">
    {{ if .Params.heroCanvas }}<canvas id="hero-canvas" aria-hidden="true"></canvas>{{ end }}
    <div class="image">
      <picture>
        <source srcset="/assets/images/main.webp" type="image/webp">
        <source srcset="/assets/images/main.png" type="image/png">
        <img src="/assets/images/main.jpg" alt="{{ i18n "ui.nav_home" | default "My profile picture" }}">
      </picture>
      {{ if .Params.viewToggle }}
      <button type="button" id="view-toggle" aria-pressed="true">
        <i class="fas fa-image" aria-hidden="true"></i> <span>{{ i18n "ui.drawing" }}</span>
      </button>
      {{ end }}
    </div>
    <div class="content">
      <div class="center">
        {{ block "main" . }}{{ end }}
        {{ partial "social.html" . }}
        {{ partial "footer.html" . }}
      </div>
    </div>
  </div>
  {{ block "scripts" . }}{{ end }}
</body>
</html>
