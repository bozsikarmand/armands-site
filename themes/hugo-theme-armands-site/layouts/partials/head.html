<meta charset="UTF-8"/>
<meta http-equiv="X-UA-Compatible" content="IE=edge"/>

<meta name="referrer" content="always"/>
<meta name="theme-color" content="#000000"/>
<meta property="og:title" content="Armand Viktor Bozsik"/>
