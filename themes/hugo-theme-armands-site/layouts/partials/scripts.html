{{/* Közös scriptek – minden oldalon kellenek (téma-, nyelvváltó, évszám).
     A contact oldalon a footer helyett töltődik be (ott a footer ki van kapcsolva). */}}
<script src="/assets/scripts/year.js" defer></script>
<script src="/assets/scripts/theme.js" defer></script>
<script src="/assets/scripts/lang-switch.js" defer></script>

<script>
// Vissza az oldal tetejére. Asztalon a .content panel görög (overflow: auto),
// mobilon a body – mindkettőt figyeljük, és ami épp görög, azt toljuk fel.
(function () {
  var scrollBox = document.querySelector('.sp-landing .content');
  var btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'to-top au-to-top';
  btn.setAttribute('aria-label', 'Back to top');
  btn.textContent = '↑';
  document.body.appendChild(btn);
  function activeScroller() {
    // mobilon a panel height: auto → nem ő görög, hanem az ablak
    if (scrollBox && scrollBox.scrollHeight > scrollBox.clientHeight + 10) return scrollBox;
    return window;
  }
  function onScroll() {
    var top = activeScroller() === window ? (window.scrollY || 0) : scrollBox.scrollTop;
    btn.classList.toggle('is-visible', top > 150);
  }
  btn.addEventListener('click', function () {
    var sc = activeScroller();
    if (sc === window) window.scrollTo({ top: 0, behavior: 'smooth' });
    else sc.scrollTo({ top: 0, behavior: 'smooth' });
  });
  if (scrollBox) scrollBox.addEventListener('scroll', onScroll, { passive: true });
  window.addEventListener('scroll', onScroll, { passive: true });
})();
</script>
