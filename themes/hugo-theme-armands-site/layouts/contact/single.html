{{ define "main" }}
<div class="introduction introduction--compact">
  <h1>{{ i18n "ui.greeting" }}</h1>
  <span class="self-identification">{{ i18n "ui.contact_title" }}</span>
</div>
<div class="contact">
  <p style="color:#999999; padding-bottom: 16px;">{{ i18n "ui.contact_intro" | safeHTML }}</p>
  <form id="site-contact-form"
        data-success="{{ i18n "ui.form_success" }}" data-error="{{ i18n "ui.form_error" }}"
        data-invalid="{{ i18n "ui.form_invalid" }}" data-notconfigured="{{ i18n "ui.form_not_configured" }}">
    <div class="cf-row au-field"><label for="cf-name">{{ i18n "ui.form_name" }}</label>
      <input type="text" id="cf-name" name="name" autocomplete="name" required maxlength="120"></div>
    <div class="cf-row au-field"><label for="cf-email">{{ i18n "ui.form_email" }}</label>
      <input type="email" id="cf-email" name="email" autocomplete="email" required maxlength="200"></div>
    <div class="cf-row au-field"><label for="cf-message">{{ i18n "ui.form_message" }}</label>
      <textarea id="cf-message" name="message" rows="5" required maxlength="5000"></textarea></div>
    <div class="cf-turnstile" data-sitekey="0x4AAAAAAF8AVTrRoWFrsN-f" data-size="invisible"></div>
    <button type="submit" class="button-contact-submit au-pill au-pill--bordered"><i class="fa fa-paper-plane"></i> {{ i18n "ui.form_send" }}</button>
    <p id="site-cf-status" role="status" aria-live="polite" style="margin-top:12px; color:#bbbbbb; min-height:1.3em;"></p>
  </form>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  <p style="color:#999999; padding: 16px 0 0 0;">{{ i18n "ui.form_privacy" | safeHTML }}</p>
</div>
<script src="/assets/scripts/contact-form.js" defer></script>
{{ end }}

{{ define "scripts" }}
{{/* A contact oldalon is kell a 3D hero (a főoldali blokk itt nem öröklődik) */}}
<script type="module" src="/assets/scripts/hero3d.js"></script>
{{ end }}
